<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="900" height="236" viewBox="0 0 900 236" role="img" aria-label="Rohan Borade, AI engineer, Mumbai. I break things. Then I build agents that don&#x27;t. Break it, build it, prove it."><title>Rohan Borade, AI engineer, Mumbai. I break things. Then I build agents that don&#x27;t. Break it, build it, prove it.</title><defs></defs><style>
text{white-space:pre}
.in{animation:in .8s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 2.2s cubic-bezier(.6,0,.2,1) .3s backwards}
@keyframes draw{from{stroke-dashoffset:1}}
.ga,.gb{opacity:0;animation:ga 6s steps(1,end) -4.2s infinite}
.gb{animation-name:gb}
.gm{animation:gm 6s steps(1,end) -4.2s infinite}
@keyframes ga{0%,84%{opacity:0;transform:none}85%{opacity:1;transform:translate(-4px,1px)}87%{transform:translate(3px,-1px)}89%{transform:translate(-2px,0)}91%,100%{opacity:0;transform:none}}
@keyframes gb{0%,84%{opacity:0;transform:none}85%{opacity:1;transform:translate(4px,-1px)}87%{transform:translate(-3px,1px)}89%{transform:translate(2px,0)}91%,100%{opacity:0;transform:none}}
@keyframes gm{0%,84%{transform:none}85%{transform:translateX(2px)}87%{transform:translateX(-2px)}89%,100%{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><g class="in"><text x="0" y="28" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#e6edf3" text-anchor="start" letter-spacing="0" >Rohan Borade</text><text x="128" y="28" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#8b949e" text-anchor="start" letter-spacing="0" >·   AI engineer   ·   Mumbai</text></g><g class="in" style="animation-delay:.1s"><g class="ga"><text x="-3" y="104" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="52" font-weight="600" letter-spacing="-1.8" fill="#56d4dd">I break things.</text></g><g class="gb"><text x="-3" y="104" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="52" font-weight="600" letter-spacing="-1.8" fill="#e0805f">I break things.</text></g><g class="gm"><text x="-3" y="104" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="52" font-weight="600" letter-spacing="-1.8" fill="#e6edf3">I break things.</text></g></g><g class="in" style="animation-delay:.25s"><text x="-3" y="166" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="52" font-weight="600" letter-spacing="-1.8" fill="#e6edf3">Then I build agents <tspan fill="#e0805f">that don't.</tspan></text></g><g class="in" style="animation-delay:.4s"><text x="0" y="218" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="600" letter-spacing="2.5"><tspan fill="#e6edf3">BREAK IT</tspan><tspan fill="#30363d">  →  </tspan><tspan fill="#e6edf3">BUILD IT</tspan><tspan fill="#30363d">  →  </tspan><tspan fill="#e0805f">PROVE IT</tspan></text></g></svg>